<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا | امتحانات في الأردن</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f8fafc; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: white; }
        .container { max-width: 600px; margin: 50px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #2563eb; text-align: center; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input, textarea { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
        button { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .back-btn { display: block; text-align: center; margin-top: 20px; color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" style="text-decoration:none; color:#2563eb; font-weight:800;">امتحانات في الأردن</a>
    </header>
    <div class="container">
        <h1>اتصل بنا</h1>
        <p style="text-align:center;">يسعدنا استقبال ملاحظاتكم واستفساراتكم</p>
        <form action="https://formspree.io/f/mzdkjjyk" method="POST">
            <input type="text" name="name" placeholder="الاسم الكامل" required>
            <input type="email" name="email" placeholder="البريد الإلكتروني" required>
            <textarea name="message" rows="5" placeholder="رسالتك..." required></textarea>
            <button type="submit">إرسال الرسالة</button>
        </form>
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
    </div>
</body>
</html>
