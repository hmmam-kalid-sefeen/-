<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الامتحانات التنافسية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; width: 90%; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .quiz-box { margin-top: 20px; padding: 15px; border: 1px solid #eee; border-radius: 10px; }
        .option-btn { display: block; width: 100%; margin: 10px 0; padding: 12px; background: #ecf0f1; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .option-btn:hover { background: #3498db; color: white; }
        #result { margin-top: 15px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>منصة الامتحانات التنافسية</h1>
        <div id="quiz" class="quiz-box">
            <p id="question">سؤال تجريبي: ما هو اختصار وحدة المعالجة المركزية؟</p>
            <button class="option-btn" onclick="checkAnswer(true)">CPU</button>
            <button class="option-btn" onclick="checkAnswer(false)">RAM</button>
            <button class="option-btn" onclick="checkAnswer(false)">GPU</button>
            <p id="result"></p>
        </div>
    </div>

    <script>
        function checkAnswer(isCorrect) {
            const res = document.getElementById('result');
            if(isCorrect) {
                res.innerHTML = "✅ إجابة صحيحة! أحسنت.";
                res.style.color = "#27ae60";
            } else {
                res.innerHTML = "❌ إجابة خاطئة، حاول مرة أخرى.";
                res.style.color = "#e74c3c";
            }
        }
    </script>

</body>
</html>
